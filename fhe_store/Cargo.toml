[package]
name = "fhe_store"
version = "0.1.0"
edition = "2021"

# 1. We tell Cargo to build a Python-compatible shared library (.so)
[lib]
name = "fhe_client"
crate-type = ["cdylib"]

# 2. We explicitly tell Cargo where our web server is
[[bin]]
name = "fhe_server"
path = "src/main.rs"

[dependencies]
# Your existing dependencies...
actix-web = "4.4"
openfhe = { git = "https://github.com/fairmath/openfhe-rs.git" }
serde = { version = "1.0", features = ["derive"] }

# NEW: The Rust-to-Python bridge
pyo3 = { version = "0.20", features = ["extension-module"] }

base64 = "0.21.5"